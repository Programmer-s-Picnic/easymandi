name: Validate web features
on:
  push:
    branches: [main]
    paths: ['web/**', 'admin/**', 'shared/**', 'tests/**', '.github/workflows/web-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: find web admin shared -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check sessions, filters, notifications and checkout
        run: node tests/web-regression.cjs
