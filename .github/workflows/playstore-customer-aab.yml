name: Build Play Store customer AAB (release upload key)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/playstore-customer-aab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.EASYMANDI_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.EASYMANDI_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.EASYMANDI_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.EASYMANDI_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Require a real Play upload signing key
        run: |
          set -euo pipefail
          for item in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            test -n "${!item}" || { echo "::error::Missing GitHub Actions secret $item. Do not use a debug signing key for Play Store."; exit 1; }
          done
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easy-mandi-play-upload.jks"
          chmod 600 "$RUNNER_TEMP/easy-mandi-play-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/easy-mandi-play-upload.jks" \
            -storepass "$PLAY_UPLOAD_STORE_PASSWORD" -alias "$PLAY_UPLOAD_KEY_ALIAS" >/dev/null
          # Refuse the testing certificate even if someone accidentally loads it as a secret.
          cert_sha1="$(keytool -list -v -keystore "$RUNNER_TEMP/easy-mandi-play-upload.jks" -storepass "$PLAY_UPLOAD_STORE_PASSWORD" -alias "$PLAY_UPLOAD_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          test "$cert_sha1" != '98:a4:cc:9b:7c:44:0b:54:8b:41:e5:88:ac:4f:88:04:1f:70:3b:7f' || { echo "::error::Testing signing key is not a valid Play upload key"; exit 1; }
          test "$PLAY_UPLOAD_KEY_ALIAS" != "androiddebugkey" || { echo "::error::Debug key alias not permitted"; exit 1; }
      - name: Prepare Android package and approved brand icon
        run: |
          flutter create --platforms=android --org in.easymandi .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/><application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="easy_mandi"/android:label="Easy Mandi"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          python3 -m pip install --user pillow
          python3 tool/make_icon.py
          rm -f test/widget_test.dart analysis_options.yaml
          flutter pub get
          flutter analyze
          flutter test
          test -f android/app/build.gradle.kts
          grep -F 'applicationId = "in.easymandi.easy_mandi"' android/app/build.gradle.kts
      - name: Set release signing with Play upload key only
        run: |
          cat >> android/app/build.gradle.kts <<'KOTLIN'

          android {
            signingConfigs {
              create("easyMandiPlayUpload") {
                storeFile = file(System.getenv("RUNNER_TEMP") + "/easy-mandi-play-upload.jks")
                storePassword = System.getenv("PLAY_UPLOAD_STORE_PASSWORD")
                keyAlias = System.getenv("PLAY_UPLOAD_KEY_ALIAS")
                keyPassword = System.getenv("PLAY_UPLOAD_KEY_PASSWORD")
              }
            }
            buildTypes {
              getByName("release") {
                signingConfig = signingConfigs.getByName("easyMandiPlayUpload")
              }
            }
          }
          KOTLIN
          flutter build appbundle --release
      - name: Verify AAB archive and signature
        run: |
          set -euo pipefail
          BUNDLE=build/app/outputs/bundle/release/app-release.aab
          test -s "$BUNDLE"
          unzip -tq "$BUNDLE" >/dev/null
          jarsigner -verify "$BUNDLE"
          sha256sum "$BUNDLE"
          keytool -list -v -keystore "$RUNNER_TEMP/easy-mandi-play-upload.jks" \
            -storepass "$PLAY_UPLOAD_STORE_PASSWORD" -alias "$PLAY_UPLOAD_KEY_ALIAS" \
            | grep -E 'SHA1:|SHA256:'
      - uses: actions/upload-artifact@v4
        with:
          name: EasyMandi-Customer-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
