name: Build Easy Mandi APK
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'tool/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
concurrency:
  group: easy-mandi-android
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org in.easymandi .
      - name: Pin Android toolchain for file picker
        run: |
          sed -i -E 's/id\("com\.android\.application"\) version "[^"]+"/id("com.android.application") version "8.11.1"/' android/settings.gradle.kts
          sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          printf '\nandroid.builtInKotlin=false\nandroid.newDsl=false\n' >> android/gradle.properties
      - name: Enable network access and app name
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/><application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="easy_mandi"/android:label="Easy Mandi"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
      - name: Create Easy Mandi launcher icon
        run: |
          python3 -m pip install --user pillow
          python3 tool/make_icon.py
      - name: Remove generated template checks
        run: rm -f test/widget_test.dart analysis_options.yaml
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Restore demo signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: easy-mandi-demo-signing-v1
      - name: Create demo signing key if absent
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Show Android signing SHA-1 for Google OAuth setup
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep 'SHA1:'
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: easy-mandi-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

