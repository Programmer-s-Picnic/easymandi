name: Build Easy Mandi APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: easy-mandi-android
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org in.easymandi .
      - name: Enable network access and app name
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="easy_mandi"/android:label="Easy Mandi"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
      - name: Create Easy Mandi launcher icon
        run: |
          python3 -m pip install --user pillow
          python3 tool/make_icon.py
      - name: Remove generated template checks
        run: rm -rf test analysis_options.yaml
      - run: flutter pub get
      - run: flutter analyze
      - name: Restore demo signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: easy-mandi-demo-signing-v1
      - name: Create demo signing key if absent
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: easy-mandi-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
