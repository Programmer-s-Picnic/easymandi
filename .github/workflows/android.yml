name: Build Easy Mandi APK
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'tool/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
concurrency:
  group: easy-mandi-android
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --org in.easymandi .
      - name: Enable network access and app name
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/><application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="easy_mandi"/android:label="Easy Mandi"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
      - name: Create Easy Mandi launcher icon
        run: |
          python3 -m pip install --user pillow
          python3 tool/make_icon.py
      - name: Remove generated template checks
        run: rm -f test/widget_test.dart analysis_options.yaml
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Restore demo signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: easy-mandi-demo-signing-v1
      - name: Create demo signing key if absent
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Verify stable cached signing key fingerprint
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -F 'SHA1: 98:A4:CC:9B:7C:44:0B:54:8B:41:E5:88:AC:4F:88:04:1F:70:3B:7F'
      - name: Force Android release to use verified stable signing key
        run: |
          set -euo pipefail
          test -f android/app/build.gradle.kts
          cat >> android/app/build.gradle.kts <<'KOTLIN'
          
          // Easy Mandi testing release: sign with the explicitly verified
          // persistent keystore, never a Gradle-generated per-build key.
          android {
            signingConfigs {
              create("easyMandiStable") {
                storeFile = file(System.getenv("HOME") + "/.android/debug.keystore")
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
              }
            }
            buildTypes {
              getByName("release") {
                signingConfig = signingConfigs.getByName("easyMandiStable")
              }
            }
          }
          KOTLIN
      - run: flutter build apk --release --split-per-abi
      - name: Verify signed APKs actually match Android OAuth and app identity
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$signer" && test -x "$aapt"
          for abi in arm64-v8a armeabi-v7a; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            test -s "$apk"
            "$signer" verify --verbose --print-certs "$apk" > /tmp/signer.txt
            sha="$(sed -n 's/.*certificate SHA-1 digest: *//p' /tmp/signer.txt | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
            echo "Actual $abi release APK signing SHA-1: $sha"
            test "$sha" = '98a4cc9b7c440b548b41e588ac4f88041f703b7f'
            "$aapt" dump badging "$apk" | grep -E "^package: name='in.easymandi.easy_mandi' versionCode='[0-9]+' versionName='1.3.11'"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: easy-mandi-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

