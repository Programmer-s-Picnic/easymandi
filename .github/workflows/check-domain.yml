name: Verify Easy Mandi domain
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'web/**'
      - 'admin/**'
      - 'CNAME'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/check-domain.cjs'
      - '.github/workflows/check-domain.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public domain routing and asset links
        run: node scripts/check-domain.cjs
      - name: Validate customer website JavaScript
        run: |
          node --check web/order-history.js
          node --check web/auth.js
          node --check web/i18n.js
          node --check web/storefront.js
          node --check web/deliveries.js
      - name: Validate admin operations scripts
        run: |
          node --check admin/operations-desk.js
          node --check admin/orders.js
          node --check admin/packing.js
          node --check admin/catalog.js
          node --check admin/records.js
