name: Audit published Easy Mandi Android OAuth signature
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-google-android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact published-source APK from successful 1.3.6+15 build
        uses: actions/download-artifact@v4
        with:
          name: easy-mandi-apk
          run-id: 37801589436
          github-token: ${{ github.token }}
          path: /tmp/easy-mandi-apks
      - name: Download previous 1.3.5+14 APK for signing-key continuity check
        uses: actions/download-artifact@v4
        with:
          name: easy-mandi-apk
          run-id: 37793553606
          github-token: ${{ github.token }}
          path: /tmp/previous-easy-mandi-apks
      - name: Verify actual APK signer, package and Android version
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find /tmp/easy-mandi-apks -type f -name app-arm64-v8a-release.apk -print -quit)"
          test -n "$apk" && test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          signer="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$signer" && test -x "$aapt"
          "$signer" verify --verbose --print-certs "$apk" | tee /tmp/apk-signature.txt
          expected='1573db67dd898b62d205e9fda87d419d249b79b4'
          for abi in arm64-v8a armeabi-v7a; do
            file="$(find /tmp/easy-mandi-apks -type f -name "app-${abi}-release.apk" -print -quit)"
            test -s "$file"
            "$signer" verify --verbose --print-certs "$file" > "/tmp/apk-${abi}-signature.txt"
            sha="$(sed -n 's/.*certificate SHA-1 digest: *//p' "/tmp/apk-${abi}-signature.txt" | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
            echo "Signed ${abi} APK SHA-1: $sha"
            test "$sha" = "$expected"
            "$aapt" dump badging "$file" | head -n 3
            actualPackage="$("$aapt" dump badging "$file" | grep -m1 '^package:' || true)"
            echo "APK ${abi} manifest identification: $actualPackage"
          done
          old="$(find /tmp/previous-easy-mandi-apks -type f -name app-arm64-v8a-release.apk -print -quit)"
          test -s "$old"
          "$signer" verify --verbose --print-certs "$old" > /tmp/previous-signature.txt
          oldSha="$(sed -n 's/.*certificate SHA-1 digest: *//p' /tmp/previous-signature.txt | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          echo "Previously published 1.3.5+14 APK SHA-1: $oldSha"
          test "$oldSha" = "$expected"
          echo "PASS: APK 1.3.5+14 and both ABI versions of 1.3.6+15 share the same signing certificate."
      - name: Check backend Web Client ID matches the Google Sign-In audience
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 15 \
            'https://cserver.learnwithchampak.live/easymandi/api/google-config.php' > /tmp/easy-google.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/easy-google.json'))
          expected='106152699344-o083fue59d1mo19si6b160gqtuap6koj.apps.googleusercontent.com'
          assert c.get('clientId')==expected,'Server provided unexpected Web Client ID'
          print('PASS: backend publishes expected Web OAuth Client ID')
          PY
