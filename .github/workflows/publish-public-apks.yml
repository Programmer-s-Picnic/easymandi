# Build 38 storage-migration repair: publish verified customer 1.3.27+38 APK binaries from pinned artifacts.
# Verified customer storage recovery 1.3.26+37: publish pinned customer APKs to easymandi.in/apk
# Hotfix 1.3.25+36: re-run verified APK publication for the already pinned source build.
name: Publish verified APKs to easymandi.in/apk
on:
  push:
    branches: [main]
    paths:
      - 'apk/release-config.json'
      - '.github/workflows/publish-public-apks.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: easymandi-public-apk-links
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned versions and download verified source files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(cat CNAME)" = "easymandi.in"
          test "$(jq -er '.domain' apk/release-config.json)" = "easymandi.in"
          cver="$(jq -er '.customer.version' apk/release-config.json)"
          dver="$(jq -er '.delivery.version' apk/release-config.json)"
          csha="$(jq -er '.customer.sourceCommit' apk/release-config.json)"
          dsha="$(jq -er '.delivery.sourceCommit' apk/release-config.json)"
          test "$(jq -er '.customer.sourceRepo' apk/release-config.json)" = 'Programmer-s-Picnic/easymandi'
          test "$(jq -er '.delivery.sourceRepo' apk/release-config.json)" = 'Programmer-s-Picnic/delivery-app'
          test "$(jq -er '.customer.a64' apk/release-config.json)" = 'easymani64.apk'
          test "$(jq -er '.customer.a32' apk/release-config.json)" = 'easymani32.apk'
          test "$(jq -er '.delivery.apk' apk/release-config.json)" = 'easymanideliverypartner.apk'
          [[ "$csha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$dsha" =~ ^[a-f0-9]{40}$ ]]

          CUSTOMER=https://api.github.com/repos/Programmer-s-Picnic/easymandi
          DELIVERY=https://github.com/Programmer-s-Picnic/delivery-app/releases/download/partner-apk
          mkdir -p /tmp/easymandi-apks
          # Do not publish a new manifest until BOTH upstream APKs have been
          # built, checksum-verified and installed at their source URLs.
          # Older signed customer APK artifacts may expire from GitHub Actions.
          # Reuse ONLY the already published customer APKs if their original pinned
          # checksums and release manifest still match exactly. Do not rebuild,
          # re-sign, or alter the customer download files during a delivery update.
          jq -e --arg ver "$cver" --arg sha "$csha" \
            '.domain=="easymandi.in" and .customer.version==$ver and .customer.sourceCommit==$sha' \
            apk/build.json >/dev/null
          test -s apk/easymani64.apk
          test -s apk/easymani32.apk
          echo "$(jq -er '.customer.sha256_64' apk/release-config.json)  apk/easymani64.apk" | sha256sum -c -
          echo "$(jq -er '.customer.sha256_32' apk/release-config.json)  apk/easymani32.apk" | sha256sum -c -
          for f in easymani64.apk easymani32.apk; do
            test "$(stat -c '%s' "apk/$f")" -gt 1000000
            unzip -tq "apk/$f" >/dev/null
            cp "apk/$f" "/tmp/easymandi-apks/$f"
          done
          # Resolve the successful pinned delivery partner APK build and
          # compare its released asset digest, never trust a mutable URL alone.
          drun="$(jq -er '.delivery.workflowRun' apk/release-config.json)"
          dsum="$(jq -er '.delivery.sha256' apk/release-config.json)"
          [[ "$dsum" =~ ^[a-f0-9]{64}$ ]]
          curl -fLsS --retry 5 \
            "https://api.github.com/repos/Programmer-s-Picnic/delivery-app/actions/runs/$drun" \
            -o /tmp/easymandi-apks/delivery-run.json
          jq -e --arg sha "$dsha" \
            '.conclusion=="success" and .head_sha==$sha and .name=="Build delivery partner APK"' \
            /tmp/easymandi-apks/delivery-run.json >/dev/null
          curl -fLsS --retry 5 \
            "https://api.github.com/repos/Programmer-s-Picnic/delivery-app/releases/tags/partner-apk" \
            -o /tmp/easymandi-apks/delivery-release.json
          jq -e --arg digest "sha256:$dsum" \
            '[.assets[] | select(.name=="app-release.apk" and .digest==$digest)] | length==1' \
            /tmp/easymandi-apks/delivery-release.json >/dev/null
          curl -fLsS --retry 5 "$DELIVERY/app-release.apk" \
            -o /tmp/easymandi-apks/easymanideliverypartner.apk
          echo "$dsum  /tmp/easymandi-apks/easymanideliverypartner.apk" | sha256sum -c -
          test "$(stat -c '%s' /tmp/easymandi-apks/easymanideliverypartner.apk)" -gt 1000000
          unzip -tq /tmp/easymandi-apks/easymanideliverypartner.apk >/dev/null
      - name: Publish APKs unchanged at requested domain paths
        run: |
          set -euo pipefail
          for apk in easymani64.apk easymani32.apk easymanideliverypartner.apk; do
            install -m 644 "/tmp/easymandi-apks/$apk" "apk/$apk"
          done
          (cd apk && sha256sum easymani64.apk easymani32.apk easymanideliverypartner.apk > SHA256SUMS)
          jq -n \
            --arg customerVersion "$(jq -r .customer.version apk/release-config.json)" \
            --arg customerCommit "$(jq -r .customer.sourceCommit apk/release-config.json)" \
            --arg deliveryVersion "$(jq -r .delivery.version apk/release-config.json)" \
            --arg deliveryCommit "$(jq -r .delivery.sourceCommit apk/release-config.json)" \
            '{domain:"easymandi.in",customer:{version:$customerVersion,sourceCommit:$customerCommit},delivery:{version:$deliveryVersion,sourceCommit:$deliveryCommit},paths:["/apk/easymani64.apk","/apk/easymani32.apk","/apk/easymanideliverypartner.apk"]}' > apk/build.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk/easymani64.apk apk/easymani32.apk apk/easymanideliverypartner.apk apk/SHA256SUMS apk/build.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified customer and delivery APKs at easymandi.in/apk'
            git pull --rebase origin main
            git push origin main
          fi
